name: test
# Auto-managed by ~/.local/bin/gh-harden-repos.sh. Do not hand-edit.
# Minimal pytest gate for Python MCP servers. Allows Layer 5
# dependabot-auto-merge to wait on a real check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  # A superseded push to the same PR cancels the in-flight run instead of
  # billing it to completion. Scoped to pull_request ONLY: push / schedule runs
  # are never cancelled (and if a merge queue is ever wired here, cancelling a
  # queued group would deadlock it). Added by MYC-3180; moved into the
  # generator by MYC-3412 so regeneration stops silently reverting it.
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          # Install the package (validates imports/build), the repo's own
          # test extra if it declares one, then pytest + pytest-asyncio so
          # async MCP-server tests run regardless of how the repo declares
          # its test dependencies.
          pip install -e ".[test]" || pip install -e ".[dev]" || pip install -e . || pip install .
          pip install pytest pytest-asyncio
      - name: Run tests
        run: |
          set +e
          pytest tests/ -v
          code=$?
          set -e
          # Exit 5 = pytest collected 0 tests. NOT tolerated.
          #
          # This template ended in `[ "$code" = "0" ] || [ "$code" = "5" ]`
          # until 2026-08-11, so a run that validated NOTHING reported exactly
          # the same green as a fully passing run -- the bug class where a
          # skipped gate and a passing gate emit the same signal.
          #
          # The tolerance was justified by a premise ("tests/ holds only
          # credential-gated integration smoke scripts with no pytest
          # functions") that was measured false across every repo carrying it:
          # all 22 have real collectable test functions. So exit 5 here does
          # not mean "nothing to run" -- it means collection BROKE (import
          # error, renamed files, wrong rootdir, a raising conftest), which is
          # a real defect this gate exists to catch.
          #
          # A repo that genuinely has no pytest suite must not carry this
          # workflow at all. gh-harden-repos.sh detects that at install time
          # and writes the explicitly-labelled NO TEST SUITE workflow instead,
          # which says so on every run rather than encoding it as a green here.
          if [ "$code" = "5" ]; then
            echo "::error title=No tests collected::pytest exited 5 -- it collected 0 tests. A gate that ran nothing is not a gate that passed, so this run fails. Fix collection; if this repo genuinely has no pytest suite it should be carrying the NO TEST SUITE workflow instead (gh-harden-repos.sh installs that automatically)."
            exit 1
          fi
          exit "$code"