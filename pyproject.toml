[project]
name = "imessage-mcp"
version = "0.1.0"
description = "macOS-only MCP server that exposes iMessage chat.db to Claude and exports per-chat history to an Obsidian vault."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Adelaida Diaz-Roa" },
]

dependencies = [
    "fastmcp>=3.2.4",
    "python-frontmatter>=1.1.0",
    "unidecode>=1.3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 110
target-version = "py311"
