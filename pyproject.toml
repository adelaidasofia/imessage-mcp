[project]
name = "imessage-mcp"
version = "0.1.0"
description = "macOS-only MCP server that exposes iMessage chat.db to Claude and exports per-chat history to an Obsidian vault."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Adelaida Diaz-Roa" },
]

dependencies = [
    "fastmcp>=3.4.2",
    "python-frontmatter>=1.3.0",
    "unidecode>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 110
target-version = "py311"
